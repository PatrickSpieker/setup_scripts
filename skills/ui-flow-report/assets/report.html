<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>UI flow report</title><style>/* REPORT_STYLE */</style></head>
<body><header><div><h1 id="title"></h1><p id="scope"></p></div><nav aria-label="Graph controls"><input id="search" type="search" placeholder="Find screen or action" aria-label="Find screen or action"><button id="previous" aria-label="Previous match">↑</button><button id="next" aria-label="Next match">↓</button><span id="matches" role="status"></span><button id="out" aria-label="Zoom out">−</button><button id="in" aria-label="Zoom in">+</button><button id="fit">Fit</button><button id="coverage">Coverage</button></nav></header>
<main id="viewport" aria-label="UI state graph" tabindex="0"><div id="world"><svg id="edges" aria-label="Interactions"></svg><div id="nodes"></div></div><p id="empty" hidden>No states captured yet. See Coverage for the exploration status.</p></main>
<aside id="details" hidden aria-label="Details"><button id="close-details" aria-label="Close details">×</button><div id="detail-content"></div></aside>
<dialog id="lightbox"><button id="close-image">Close</button><img id="large-image" alt=""></dialog>
<script id="report-data" type="application/json">/* REPORT_DATA */</script><script>/* REPORT_SCRIPT */</script></body></html>
